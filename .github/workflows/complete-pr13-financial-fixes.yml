          node --check notifications.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          fluxo = Path('fluxo-de-caixa.js').read_text(encoding='utf-8')
          notifications = Path('notifications.js').read_text(encoding='utf-8')
          mov = Path('movimentacao-bancaria.js').read_text(encoding='utf-8')

          assert "allDespesas.map(doc => getDocs(collection(doc.ref, 'pagamentos')))" not in html
