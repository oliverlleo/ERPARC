name: Apply PR13 complete fix

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 13 && github.event.label.name == 'apply-pr13-complete-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/financial-consistency-firestore-performance
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/run-pr13-complete-fix.py

      - name: Validate source
        shell: bash
        run: |
          node --check financial-ledger.js
          node --check fluxo-de-caixa.js
          node --check movimentacao-bancaria.js
          node --check notifications.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          fluxo = Path('fluxo-de-caixa.js').read_text(encoding='utf-8')
          notifications = Path('notifications.js').read_text(encoding='utf-8')
          mov = Path('movimentacao-bancaria.js').read_text(encoding='utf-8')
          assert "allDespesas.map(doc => getDocs(collection(doc.ref, 'pagamentos')))" not in html
          assert "allReceitas.map(doc => getDocs(collection(doc.ref, 'recebimentos')))" not in html
          assert 'fetchTransactionsEfficiently' not in fluxo
          assert 'fetchFinancialLedger(db, userId' in fluxo
          assert 'financialMovementsAnteriores' in fluxo
          assert "collection(db, 'users', userId, 'systemUsers')" in html
          assert "collection(db, 'users', userId, 'usuarios')" not in html
          assert 'syncSystemUsersDropdown' not in notifications
          assert html.count('movimentacoesFinanceiras') >= 5
          assert 'financialMovementDocId(type, parentId, transacaoId)' in fluxo
          assert 'movimentacoesFinanceiras' in mov
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, flags=re.S)
          main_script = next((s for s in scripts if 'Importações do Firebase SDK' in s), None)
          if not main_script:
              raise RuntimeError('main inline module not found')
          Path('/tmp/index-main.mjs').write_text(main_script, encoding='utf-8')
          PY
          node --check /tmp/index-main.mjs
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fluxo-de-caixa.js movimentacao-bancaria.js notifications.js
          git diff --cached --quiet && exit 0
          git commit -m "complete financial ledger and eliminate recurring N+1 reads"
          git push origin HEAD:fix/financial-consistency-firestore-performance
