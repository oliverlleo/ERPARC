name: Apply security hardening

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.number == 14 && github.event.label.name == 'apply-security-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-auth-reporting-hardening-v2
          fetch-depth: 0

      - name: Apply deterministic hardening patch
        run: python3 scripts/apply-security-hardening.py

      - name: Validate hardened source
        shell: bash
        run: |
          node --check auth-company.js
          node --check security-utils.js
          node --check financial-ledger.js
          node --check fluxo-de-caixa.js
          node --check movimentacao-bancaria.js
          node --check notifications.js
          node --check relatorios.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          auth = Path('auth-company.js').read_text(encoding='utf-8')
          notifications = Path('notifications.js').read_text(encoding='utf-8')
          reports = Path('relatorios.js').read_text(encoding='utf-8')
          rules = Path('firestore.rules').read_text(encoding='utf-8')
          fluxo = Path('fluxo-de-caixa.js').read_text(encoding='utf-8')
          bank = Path('movimentacao-bancaria.js').read_text(encoding='utf-8')

          forbidden = [
              'sessionStorage',
              'test.user@email.com',
              'window.IS_TEST_RUN',
              'where("senha"',
              "where('senha'",
              'data-password=',
              '>Ver Senha<',
              'senha: newPassword'
          ]
          for token in forbidden:
              assert token not in html, f'forbidden legacy auth token remains: {token}'

          assert 'signInCompanyUser({ auth, db' in html
          assert 'migrateLegacyCompanyAccesses({ db, firebaseConfig' in html
          assert 'getCompanyAccessProfile(db, user.uid)' in html
          assert 'createCompanyAccess({' in html
          assert 'disableCompanyAccess({ db, accessId: id })' in html
          assert 'generateSecureRandomPassword' in html
          assert 'crypto.getRandomValues' in auth
          assert 'senha: deleteField()' in auth
          assert "const intervalId = setInterval" in notifications
          assert 'clearInterval(intervalId)' in notifications
          assert 'unsubscribeSnapshot()' in notifications
          assert 'escapeHtml(notification.message)' in notifications
          assert 'safeMaterialIcon(notification.icon)' in notifications
          assert 'const contasPorId = new Map' in reports
          assert "lancamento.codigoPlanoDeContas || contasPorId.get(lancamento.categoriaId)?.codigo" in reports
          assert 'escapeHtml(node.nome)' in reports
          assert 'escapeHtml(t.descricao)' in fluxo
          assert 'escapeHtml(mov.descricao' in bank
          assert 'allow list: if false;' in rules
          assert 'tenantMember(userId)' in rules
          assert 'allow read, write: if false;' in rules

          scripts = re.findall(r'<script type="module">(.*?)</script>', html, flags=re.S)
          main_script = next((s for s in scripts if 'Importações do Firebase SDK' in s), None)
          if not main_script:
              raise RuntimeError('main inline module not found')
          Path('/tmp/index-main.mjs').write_text(main_script, encoding='utf-8')
          PY
          node --check /tmp/index-main.mjs
          git diff --check

      - name: Commit hardened source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html notifications.js relatorios.js movimentacao-bancaria.js fluxo-de-caixa.js
          git diff --cached --quiet && exit 0
          git commit -m "apply auth security and reporting hardening"
          git push origin HEAD:fix/security-auth-reporting-hardening-v2
